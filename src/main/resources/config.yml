# ====== 准备阶段配置 ======
waiting:
  # 双方最少人数
  min_population_per_side: 2
  # 双方最大人数差
  max_side_diff: 1
  # 全局最大人数（含观战者）
  max_population: 16
  # 玩家加入后是否默认为观战者
  # true: 加入后为观战者，需手动选队
  # false: 加入后为 UNKNOWN，等待分配
  default_side_after_join_spectator_or_unknown: true
  # 是否需全员准备
  require_ready: true
  # 大厅出生点（等待阶段玩家聚集点）
  lobby_spawnpoint: { x: 0.0, y: 64.0, z: 0.0 }

# ====== 角色选择阶段配置 ======
role_selection:
  # 选择倒计时（tick），0 = 必须全部手动选完
  duration: 600
  # 倒计时结束自动随机分配
  auto_assign: true
  # 角色选择结束后，双方进入对局的初始出生点
  attacker_spawnpoint: { x: -30.0, y: 65.0, z: 200.0 }
  defender_spawnpoint: { x: 30.0, y: 65.0, z: 200.0 }

# ====== 对局阶段配置 ======
playing:
  # 是否允许同阵营选择重复角色
  allow_duplicate_roles: false

# ====== 可用地图列表 ======
maps:
  - "map_crossfire"
  - "map_dust2"
