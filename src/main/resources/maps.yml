          - id: "bomb_a"
            name: "A点"
            region:                 # 炸弹操作范围（立方体：角点）
              start: { x: -35.0, y: 61.0, z: 195.0 }
              end:   { x: -25.0, y: 71.0, z: 205.0 }
            plant_time: 80          # 安放炸弹所需时间（tick）
            fuse_time: 1200         # 引信倒计时（tick），60 秒
            defuse_time: 100        # 拆除炸弹所需时间（tick）
